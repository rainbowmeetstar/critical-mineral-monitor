version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cmm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - mineral_db:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/minerals.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cmm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mineral_db:
